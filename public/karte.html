<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archivkarte</title><style>
:root{color-scheme:light;--ink:#263a30;--green:#41674d;--muted:#667265;--line:#dbe2d5;--paper:#fafbf7;--tint:#edf2e7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1140px;margin:auto;padding:28px 24px 36px}a{color:var(--green);text-underline-offset:4px}.back{font-size:14px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:24px 0 18px}h1{font:clamp(29px,5vw,46px)/1.16 Georgia,serif;margin:6px 0 12px}p{margin:0}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.intro{max-width:680px;color:var(--muted)}.badge{border:1px solid var(--line);border-radius:30px;padding:5px 12px;font-size:12px;white-space:nowrap;background:var(--tint)}.card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:white;box-shadow:0 8px 32px #263a3008}.map-wrap{position:relative;background:var(--tint)}#map{height:clamp(320px,57vh,620px);width:100%}.map-year{position:absolute;right:16px;top:16px;z-index:1;padding:6px 16px;background:#fafbf7ee;border:1px solid var(--line);border-radius:10px;font:30px/1.4 Georgia,serif;pointer-events:none}.controls{padding:22px 26px;background:var(--tint);border-top:1px solid var(--line)}.control-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.year-label{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}input[type=number]{width:100px;border:1px solid #b6c5b0;border-radius:8px;background:white;padding:9px 10px;font:600 19px system-ui;color:var(--ink)}button{cursor:pointer;min-height:44px;border:1px solid #bac9b3;border-radius:8px;background:white;padding:9px 14px;color:var(--ink);font:14px system-ui}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap}input[type=range]{width:100%;margin:20px 0 4px;accent-color:var(--green);height:32px;cursor:pointer;touch-action:pan-y}.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.hint{font-size:12px;margin:10px 0 0;color:var(--muted)}#status{padding:11px 26px;min-height:42px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}#status.error{color:#843926;background:#fff4ea}.note{margin:20px 0 0;max-width:880px;color:var(--muted);font-size:13px}.note strong{color:var(--ink)}footer{margin-top:14px;color:var(--muted);font-size:12px}:focus-visible{outline:3px solid #698969;outline-offset:4px}.maplibregl-ctrl-attrib{font-size:11px}.maplibregl-ctrl-attrib a{color:#263a30}@media(max-width:600px){main{padding:20px 14px}.heading{display:block;margin-top:20px}.badge{display:inline-block;margin-top:14px}.controls{padding:18px 16px}.control-top{gap:12px}.actions{width:100%}.actions button{flex:1;padding:9px 8px}.map-year{font-size:25px;right:10px;top:10px}#status{padding:10px 16px}.ticks span:nth-child(2),.ticks span:nth-child(4){display:none}}
html.embedded main{max-width:none;padding:0 0 20px}html.embedded .back{display:none}html.embedded .heading{margin-top:0}

html.preview main{padding:0;max-width:none}html.preview .heading,html.preview .back,html.preview .note,html.preview footer,html.preview .controls,html.preview .map-year{display:none}html.preview #map{height:calc(100vh - 54px)}html.preview .card{border:0;border-radius:0}html.preview #status{background:white}.maplibregl-marker{cursor:grab}
</style></head><body><main>
<a class="back" href="/?ansicht=oeffentlich">← Zurück zum öffentlichen Profil</a>
<header class="heading"><div><p class="eyebrow" id="eyebrow">Archivkarte</p><h1 id="title">Karte wird geladen …</h1><p class="intro" id="intro"></p></div></header>
<section class="card" aria-label="Archivkarte"><div class="map-wrap"><div id="map" role="region" aria-label="Karte der gewählten Umgebung"></div><output class="map-year" id="map-year" aria-label="Dargestelltes Jahr" hidden>1900</output></div>
<div class="controls" id="time-controls" hidden><div class="control-top"><label class="year-label" for="year">Jahr anzeigen <input id="year" type="number" min="800" max="2026" value="1900" step="1" disabled></label><div class="actions"><button id="play" class="primary" type="button" disabled aria-pressed="false">▶ Abspielen</button><button id="reset" type="button" disabled>Ansicht zurücksetzen</button></div></div><label class="hint" for="slider">Durch die Zeit bewegen</label><input id="slider" type="range" min="800" max="2026" step="1" value="1900" disabled aria-valuetext="Jahr 1900"><div class="ticks" aria-hidden="true"><span>800</span><span>1100</span><span>1400</span><span>1700</span><span id="last-year">2026</span></div><p class="hint">Jahresgenaue Auswahl · Automatische Wiedergabe in Zehnjahresschritten</p></div><p id="status" role="status" aria-live="polite">Kartenkonfiguration wird geladen …</p></section>
<p class="note" id="note"></p><footer id="credits"></footer><noscript><p>Für die interaktive Karte muss JavaScript aktiviert sein.</p></noscript>
</main><script src="/archive-map.js"></script></body></html>
